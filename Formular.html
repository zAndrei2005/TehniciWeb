    <div class="form-container">
        <h1>Înscriere Sala de Forță</h1>
        <form id="gymForm">
        
            <div class="form-group">
                <label for="name">Nume complet:</label>
                <input 
                type="text" 
                id="name" 
                name="name" 
                required 
                pattern="^[a-zA-Z\s]+$" 
                title="Numele trebuie să conțină doar litere și spații.">
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input 
                type="email" 
                id="email" 
                name="email" 
                required 
                pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" 
                title="Introduceți o adresă de email validă.">   
            </div>
            
            <div class="form-group">
                <label for="dob">Data nașterii:</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            
            <div class="form-group">
                <label for="experience">Nivel de experiență:</label>
                <select id="experience" name="experience">
                    <option value="incepator">Începător</option>
                    <option value="intermediar">Intermediar</option>
                    <option value="avansat">Avansat</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Obiective personale:</label>
                <div>
                    <input type="checkbox" id="slabire" name="objective" value="slabire">
                    <label for="slabire">Slăbire</label>
                </div>
                <div>
                    <input type="checkbox" id="masa" name="objective" value="masa musculara">
                    <label for="masa">Creștere masă musculară</label>
                </div>
                <div>
                    <input type="checkbox" id="mentinere" name="objective" value="mentinere">
                    <label for="mentinere">Menținere</label>
                </div>
            </div>
            
            <div class="form-group">
                <label>Tip de abonament:</label>
                <div>
                    <input type="radio" id="lunar" name="membership" value="lunar" checked>
                    <label for="lunar">Lunar</label>
                </div>
                <div>
                    <input type="radio" id="trimestrial" name="membership" value="trimestrial">
                    <label for="trimestrial">Trimestrial</label>
                </div>
                <div>
                    <input type="radio" id="anual" name="membership" value="anual">
                    <label for="anual">Anual</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="slider">Nivel de dificultate dorit (1-10):</label>
                <input type="range" id="slider" name="slider" min="1" max="10" value="5">
                <span id="sliderValue">5</span>
            </div>
            
            <div class="form-group">
                <label for="color">Culoare preferată:</label>
                <input type="color" id="color" name="color">
            </div>
            
            <button class="button111" type="submit">Trimite</button>
        </form>

        <button id="toggleColor">Schimbă culoarea fundalului</button>
    </div>
